name: HDFilmizle Dizi M3U Güncelle

on:
  schedule:
    # Her 2 günde bir UTC 04:00
    - cron: "0 4 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dizi-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dizi M3U listesini tara
        env:
          DIZI_BASLANGIC: "1"
          DIZI_BITIS: "50"
          WORKER_COUNT: "8"
        run: python scraper_dizi.py

      - name: Değişiklik varsa commit ve push et
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Dizi M3U listesi otomatik güncellendi"
          file_pattern: hdfilmizle-dizi.m3u
